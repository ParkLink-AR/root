# Levanta todo el ecosistema de ParkLink:
# auth-service, parking-service, booking-service, payment-service,
# notifications-service y el gateway (+ sus bases de datos y RabbitMQ).
#
# Uso:
#   make env   # crea el .env de cada servicio desde su .env.example (si no existe)
#   make up
#
# Cada servicio lee sus claves y su config de su propio ./<servicio>/.env (fuera de git).
# Acá, en `environment`, solo va lo que depende de la red de Docker (bases, URLs entre
# servicios, RabbitMQ): pisa los valores de localhost que trae cada .env para correr suelto.
#
# Push notifications: el JSON de service-account de Firebase va en
# ./notifications-service/secrets/ (fuera de git) y se montea en el contenedor
# (ver mobile/PUSH_NOTIFICATIONS.md).

# Public DNS for the services that call out (Mercado Pago, push, email, maps, R2): Docker
# Desktop's own resolver can stall for seconds on IPv6 lookups (api.mercadopago.com failed
# after 4-9 s), which made opening the Mercado Pago checkout slow. Service names inside the
# network (payment-service, db-booking...) still resolve through Docker as always.
x-public-dns: &public-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  # ---------------- auth-service ----------------
  db-auth:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=parklink_auth
      - POSTGRES_PASSWORD=parklink_auth
      - POSTGRES_DB=parklink_auth_db
    # Internal database: not exposed to host machine
    volumes:
      - parklink_auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parklink_auth -d parklink_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    <<: *public-dns
    restart: unless-stopped
    build: ./auth-service
    env_file: ./auth-service/.env
    # Internal microservice: all client traffic routes through gateway:8080
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      # Requests must carry the gateway's secret or the service-to-service key (see
      # each service's trusted-caller middleware) -- shared with the gateway / other services.
      # Suspending/closing/deleting an account pauses or archives the owner's spots,
      # cancels its bookings and drops its push tokens (app/services/account_lifecycle.py).
      - PARKING_SERVICE_URL=http://parking-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:8080
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:8000
      - DATABASE_URL=postgresql://parklink_auth:parklink_auth@db-auth:5432/parklink_auth_db
      # Cloudflare R2 -- avatares subidos acá (ver DEPLOY.md para cómo crear
      # el bucket). parking-service usa el mismo bucket/credenciales para
      # las fotos de cochera.
    depends_on:
      db-auth:
        condition: service_healthy

  # ---------------- parking-service ----------------
  db-parking:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=parklink
      - POSTGRES_PASSWORD=parklink
      - POSTGRES_DB=parking_service
    # Internal database: not exposed to host machine
    volumes:
      - parklink_parking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parklink -d parking_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  parking-service:
    <<: *public-dns
    restart: unless-stopped
    build: ./parking-service
    env_file: ./parking-service/.env
    # Internal microservice: all client traffic routes through gateway:8080
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      # Requests must carry the gateway's secret or the service-to-service key (see
      # each service's trusted-caller middleware) -- shared with the gateway / other services.
      - DB_HOST=db-parking
      - DB_PORT=5432
      - DB_USER=parklink
      - DB_PASSWORD=parklink
      - DB_NAME=parking_service
      - PORT=3001
      - BOOKING_SERVICE_URL=http://booking-service:8080
      # Antes de publicar una cochera, parking-service le pregunta a auth-service si el
      # dueño tiene cargados sus datos de cobro -- sin esto, publicar falla con 502.
      - AUTH_SERVICE_URL=http://auth-service:8000
      # Eventos de dominio (p.ej. parking_spot.reviewed -> notificación al dueño cuando un
      # admin aprueba o rechaza su cochera), al mismo exchange que el resto.
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # Mismo bucket R2 que auth-service, para las fotos de cochera.
    depends_on:
      db-parking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------- booking-service ----------------
  db-booking:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=bookinguser
      - POSTGRES_PASSWORD=bookingpass
      - POSTGRES_DB=booking_db
    # Internal database: not exposed to host machine
    volumes:
      - parklink_booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-service:
    <<: *public-dns
    restart: unless-stopped
    build: ./booking-service
    env_file: ./booking-service/.env
    # Internal microservice: all client traffic routes through gateway:8080
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      # Requests must carry the gateway's secret or the service-to-service key (see
      # each service's trusted-caller middleware) -- shared with the gateway / other services.
      - HTTP_PORT=8080
      - DB_DSN=postgres://bookinguser:bookingpass@db-booking:5432/booking_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PARKING_SERVICE_URL=http://parking-service:3001
      - PAYMENT_SERVICE_URL=http://payment-service:8004
      # Only an ACTIVE account can book (not a suspended one, nor one being deleted).
      - AUTH_SERVICE_URL=http://auth-service:8000
      # Bucket R2 propio y PRIVADO para los comprobantes de pago (bank-transfer receipts) --
      # deliberadamente distinto del bucket público de auth-service/parking-service (fotos de
      # perfil/cochera): un comprobante es un documento financiero privado, nunca debe quedar
      # en una URL pública adivinable. Mismo R2_ACCOUNT_ID/credenciales (misma cuenta de
      # Cloudflare), pero el token tiene que tener permiso sobre este bucket también. Sin
      # R2_PUBLIC_URL a propósito: las lecturas usan URLs firmadas de corta duración (ver
      # storage.Client.ResolveProofURL), nunca una URL pública fija.
    depends_on:
      db-booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------- payment-service ----------------
  db-payment:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user_payment
      - POSTGRES_PASSWORD=pass_payment
      - POSTGRES_DB=payment_db
    # Internal database: not exposed to host machine
    volumes:
      - parklink_payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_payment -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    <<: *public-dns
    restart: unless-stopped
    build: ./payment-service
    env_file: ./payment-service/.env
    # Internal microservice: all client traffic routes through gateway:8080
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      - PORT=8004
      - DATABASE_URL=postgresql://user_payment:pass_payment@db-payment:5432/payment_db
      # Compartida con booking-service: protege POST /internal/refund-by-payment
      # (booking -> payment) y POST /bookings/{id}/confirm (payment -> booking),
      # ninguno de los dos pasa por el gateway.
      # Sin credenciales reales de Mercado Pago el servicio arranca igual,
      # pero crear una preferencia de pago real va a fallar.
      # Configurá MERCADOPAGO_ACCESS_TOKEN y MERCADOPAGO_WEBHOOK_SECRET en tu .env.
      # WEBHOOK_BASE_URL debe ser una URL pública (ej. ngrok) para que MP pueda
      # notificar pagos.
      - BOOKING_SERVICE_URL=http://booking-service:8080
      # Eventos de dominio (refund.completed -> aviso al conductor cuando se acredita un
      # reembolso que había fallado), al mismo exchange que el resto.
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db-payment:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # ---------------- notifications-service ----------------
  db-notifications:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=parklink_notif
      - POSTGRES_PASSWORD=parklink_notif
      - POSTGRES_DB=parklink_notif_db
    # Internal database: not exposed to host machine
    volumes:
      - parklink_notif_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parklink_notif -d parklink_notif_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifications-service:
    <<: *public-dns
    restart: unless-stopped
    build: ./notifications-service
    env_file: ./notifications-service/.env
    # Internal microservice: all client traffic routes through gateway:8080
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      # Requests must carry the gateway's secret or the service-to-service key (see
      # each service's trusted-caller middleware) -- shared with the gateway / other services.
      - DATABASE_URL=postgresql://parklink_notif:parklink_notif@db-notifications:5432/parklink_notif_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # The service-account JSON lives in ./notifications-service/secrets/ (outside git)
      # and is mounted below.
      # FIREBASE_CREDENTIALS_PATH= (empty) in .env forces log-only.
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
      # Email to ParkLink's support inbox when a user opens a ticket or writes on one (same
      # Brevo account as auth-service). ADMIN_PANEL_URL adds an "open in the panel" link.
    volumes:
      - ./notifications-service/secrets:/run/secrets:ro
    depends_on:
      db-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------- gateway ----------------
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - parklink_rabbitmq_data:/var/lib/rabbitmq

  gateway:
    <<: *public-dns
    restart: unless-stopped
    build: ./gateway
    env_file: ./gateway/.env
    ports:
      - "8080:8080"
    environment:
      # Error reports to Sentry: off while SENTRY_DSN is empty (see each service's monitoring module).
      - AUTH_SERVICE_URL=http://auth-service:8000
      - PARKING_SERVICE_URL=http://parking-service:3001
      - PAYMENT_SERVICE_URL=http://payment-service:8004
      - BOOKING_SERVICE_URL=http://booking-service:8080
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:8000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      auth-service:
        condition: service_started
      parking-service:
        condition: service_started
      payment-service:
        condition: service_started
      booking-service:
        condition: service_started
      notifications-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  parklink_auth_db_data:
  parklink_parking_db_data:
  parklink_payment_db_data:
  parklink_booking_db_data:
  parklink_notif_db_data:
  parklink_rabbitmq_data:
