# Render Blueprint — deploys the whole ParkLink backend for free, with
# everything auto-provisioned on import: no env var needs to be pasted by
# hand in the dashboard, except RABBITMQ_URL (see below, the one thing
# Render's Blueprint spec genuinely can't provision for you).
#
# Reference: https://render.com/docs/blueprint-spec (the exact field names
# below have changed before as Render evolves the schema. If Render's
# Blueprint import rejects a field, it names the exact line in the error;
# rename that key to whatever the current docs say and everything else
# here still applies).
#
# What's fully automatic:
#   - 1 free Postgres database, shared by all 5 services that need one --
#     Render's free plan allows exactly one active free-tier database per
#     account (confirmed against a real account; the docs don't state this
#     explicitly), so 5 separate free databases isn't possible. All 5
#     services connect to the same instance; their table names don't
#     collide (verified: users/refresh_tokens/... vs parking_spots/... vs
#     transactions vs bookings/... vs device_tokens/...), so this is safe.
#   - PostGIS on parking-service's database: the app itself runs
#     `CREATE EXTENSION IF NOT EXISTS postgis` before its first connection
#     (see parking-service/src/config/typeorm.config.ts) -- no manual psql.
#   - Every secret shared between services (JWT_SECRET, GATEWAY_INTERNAL_SECRET,
#     INTERNAL_SERVICE_KEY) is generated once (`generateValue: true`) on the
#     service that owns it and referenced by the others via `fromService`,
#     same pattern Render's own docs recommend.
#   - Brevo, Cloudflare R2 and Mercado Pago credentials are embedded below
#     as the real values already used for local dev (see root/.env) --
#     this is a private repo, same tradeoff already made for the Firebase
#     service-account JSON (see mobile/PUSH_NOTIFICATIONS.md). If this repo
#     is ever made public, rotate all of these first.
#   - notifications-service's Firebase service-account JSON is already
#     committed at notifications-service/secrets/ and copied into the
#     Docker image by its Dockerfile -- GOOGLE_APPLICATION_CREDENTIALS just
#     points at that in-image path, no Render Secret File upload needed.
#
# What's NOT included / still manual:
#   - RabbitMQ: Render has no managed RabbitMQ on any plan. booking-service
#     hard-requires it to boot (unlike gateway/notifications-service, which
#     tolerate its absence) -- sign up for a free broker (e.g. CloudAMQP's
#     free "Little Lemur" plan takes ~2 minutes) and paste the AMQP URL into
#     `parklink-booking-service`'s RABBITMQ_URL in the Render dashboard.
#     gateway and notifications-service both reference that same value via
#     `fromService`, so it only needs to be pasted in that one place.
#   - mobile: it's an Expo app, Render doesn't host it. Point its
#     EXPO_PUBLIC_API_URL at parklink-gateway's URL below when testing
#     against this deploy.
#   - Real Mercado Pago payments: the credentials below are whatever is
#     currently in root/.env (works for whatever mode -- test or live --
#     that token is already in). Swap them for different Mercado Pago
#     Developer credentials if you want a different mode.

databases:
  - name: parklink-db
    plan: free
    databaseName: parklink
    user: parklink

services:
  # ---------------- auth-service ----------------
  - type: web
    name: parklink-auth-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    healthCheckPath: /livez
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parklink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: BREVO_API_KEY
        value: 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
      - key: EMAIL_FROM
        value: no-reply@mail.parklink.com.ar
      - key: EMAIL_FROM_NAME
        value: ParkLink Argentina
      # Twilio (SMS) -- cuenta paga con Trust Hub compliance profile (Individual)
      # ya aprobado. A diferencia de Brevo/R2/Mercado Pago abajo, ésta no va
      # embebida -- pegala vos en el dashboard de Render (parklink-auth-service
      # -> Environment) después de importar el Blueprint.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # false porque ENVIRONMENT=production lo exige (auth-service arranca
      # con FATAL si no -- ver app/config.py) -- con BREVO_API_KEY real de
      # arriba, el código de verificación sale por mail de verdad.
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
      # "true" hasta que pegues las tres credenciales de Twilio arriba en el
      # dashboard de Render -- sin ellas, Twilio cae en modo log-only (ver
      # app/utils/sms.py) y el registro quedaría bloqueado en el paso de
      # teléfono. Una vez que las pegues, pasá esto a "false" (permitido en
      # producción, a diferencia de SKIP_EMAIL_VERIFICATION) y sincronizá de
      # nuevo.
      - key: SKIP_PHONE_VERIFICATION
        value: "true"
      # Cloudflare R2 -- avatares (parking-service reusa este mismo bucket
      # para fotos de cochera via `fromService` más abajo).
      - key: R2_ACCOUNT_ID
        value: f39a24e6a9a51c89d87f17877c333023
      - key: R2_ACCESS_KEY_ID
        value: d53b32004e29bc17092059bc81cb19cd
      - key: R2_SECRET_ACCESS_KEY
        value: 82f4aaada4bbb54b70652884342640d8bb7f342660dadeceb82ddafbbb097735
      - key: R2_BUCKET_NAME
        value: parklink-photos
      - key: R2_PUBLIC_URL
        value: https://pub-33da991dc2454c8fb2b61d1880a831a8.r2.dev

  # ---------------- parking-service ----------------
  - type: web
    name: parklink-parking-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./parking-service/Dockerfile
    dockerContext: ./parking-service
    envVars:
      # Un solo connection string en vez de DB_HOST/PORT/USER/PASSWORD
      # sueltos -- Render sólo expone el string completo de una base
      # gestionada, no sus partes por separado (ver typeorm.config.ts,
      # que acepta las dos formas: ésta para Render, las sueltas para el
      # compose local).
      - key: DATABASE_URL
        fromDatabase:
          name: parklink-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        value: parklink-app/1.0
      - key: BOOKING_SERVICE_URL
        value: https://parklink-booking-service.onrender.com
      # Mismo bucket R2 que auth-service -- se referencia en vez de
      # duplicar las credenciales a mano en este servicio también.
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: R2_BUCKET_NAME
      - key: R2_PUBLIC_URL
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: R2_PUBLIC_URL

  # ---------------- booking-service ----------------
  - type: web
    name: parklink-booking-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./booking-service/Dockerfile
    dockerContext: ./booking-service
    envVars:
      - key: HTTP_PORT
        value: "8080"
      - key: DB_DSN
        fromDatabase:
          name: parklink-db
          property: connectionString
      # El único valor que no se puede autoprovisionar -- Render no tiene
      # RabbitMQ gestionado. Pegá acá la URL de un broker externo (ver el
      # comentario del encabezado); gateway y notifications-service la
      # toman de acá mismo, no hace falta repetirla.
      - key: RABBITMQ_URL
        sync: false
      - key: BOOKING_HOLD_MINUTES
        value: "15"
      - key: BOOKING_AVAILABILITY_MAX_DAYS
        value: "14"
      - key: PARKING_SERVICE_URL
        value: https://parklink-parking-service.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://parklink-payment-service.onrender.com
      - key: OWNER_APPROVAL_HOURS
        value: "24"
      # Protege POST /internal/refund-by-payment en payment-service, que
      # este servicio llama directo (no vía gateway) -- generado ahí,
      # referenciado acá.
      - key: INTERNAL_SERVICE_KEY
        fromService:
          type: web
          name: parklink-payment-service
          envVarKey: INTERNAL_SERVICE_KEY

  # ---------------- payment-service ----------------
  - type: web
    name: parklink-payment-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./payment-service/Dockerfile
    dockerContext: ./payment-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8004"
      - key: DATABASE_URL
        fromDatabase:
          name: parklink-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: JWT_SECRET
      - key: GATEWAY_INTERNAL_SECRET
        fromService:
          type: web
          name: parklink-gateway
          envVarKey: GATEWAY_INTERNAL_SECRET
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: MERCADOPAGO_ACCESS_TOKEN
        value: APP_USR-5935129209492371-083022-121fbc0f425d9c40be14724a4064ccdf-3339648528
      - key: MERCADOPAGO_WEBHOOK_SECRET
        value: f39f99d8e7ca17d0cc1e6151d5b6d117334b37a9302b18abddac7f1285aef18b
      - key: MP_FORCE_TEST_PAYER_EMAIL
        value: ""
      - key: APP_BASE_URL
        value: https://parklink-payment-service.onrender.com
      - key: WEBHOOK_BASE_URL
        value: https://parklink-payment-service.onrender.com
      # Deep links: la app mobile los registra con ese esquema custom
      # (parklink://...), no son URLs http -- mismo default que compose.yaml.
      - key: FRONTEND_SUCCESS_URL
        value: parklink://payment/success
      - key: FRONTEND_FAILURE_URL
        value: parklink://payment/failure
      - key: FRONTEND_PENDING_URL
        value: parklink://payment/pending
      - key: DEFAULT_CURRENCY
        value: ARS
      - key: BOOKING_SERVICE_URL
        value: https://parklink-booking-service.onrender.com
      # admin-dashboard fetches /api/payments/metrics directly (not through
      # the gateway) -- restrict this to its real origin once deployed.
      - key: CORS_ORIGINS
        value: "*"

  # ---------------- notifications-service ----------------
  - type: web
    name: parklink-notifications-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./notifications-service/Dockerfile
    dockerContext: ./notifications-service
    healthCheckPath: /livez
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parklink-db
          property: connectionString
      - key: RABBITMQ_URL
        fromService:
          type: web
          name: parklink-booking-service
          envVarKey: RABBITMQ_URL
      - key: EVENTS_EXCHANGE
        value: parklink.events
      - key: NOTIFICATIONS_QUEUE
        value: notifications.events
      - key: PARKING_SERVICE_URL
        value: https://parklink-parking-service.onrender.com
      # El JSON de Firebase ya viene commiteado en notifications-service/secrets/
      # y el Dockerfile lo copia adentro de la imagen (COPY . .) -- esta ruta
      # es dónde queda una vez armada, no hace falta subir un Secret File.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /app/secrets/firebase-service-account.json

  # ---------------- gateway ----------------
  - type: web
    name: parklink-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    healthCheckPath: /livez
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        value: https://parklink-auth-service.onrender.com
      - key: PARKING_SERVICE_URL
        value: https://parklink-parking-service.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://parklink-payment-service.onrender.com
      - key: BOOKING_SERVICE_URL
        value: https://parklink-booking-service.onrender.com
      - key: NOTIFICATIONS_SERVICE_URL
        value: https://parklink-notifications-service.onrender.com
      - key: JWT_SECRET
        fromService:
          type: web
          name: parklink-auth-service
          envVarKey: JWT_SECRET
      - key: JWT_ALGORITHM
        value: HS256
      - key: GATEWAY_INTERNAL_SECRET
        generateValue: true
      - key: RABBITMQ_URL
        fromService:
          type: web
          name: parklink-booking-service
          envVarKey: RABBITMQ_URL
      - key: EVENTS_EXCHANGE
        value: parklink.events
      - key: CORS_ORIGINS
        value: "*"
      - key: UPSTREAM_TIMEOUT_SECONDS
        value: "15"